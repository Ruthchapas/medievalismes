@if (place(); as p) {
  <article class="fitxa">
    <app-place-header
      [place]="p"
      [saved]="savedService.isSaved(p.slug)"
      (savedChange)="savedService.toggle(p.slug)"
    />

    <div class="body">
      <app-rich-text [paragraphs]="p.introText" />

      @if (p.contextText.length) {
        <div class="story">
          <p class="eyebrow-sm">El relat</p>
          <app-rich-text variant="context" [paragraphs]="p.contextText" />
        </div>
      }

      <app-place-highlights [highlights]="p.highlights" [placeSlug]="p.slug" />
      <app-place-gallery [photos]="p.gallery" [label]="p.name" />
      <app-place-nearby [place]="p" />
    </div>
  </article>
} @else {
  <main class="not-found">
    <a routerLink="/mapa" class="back">‹ Mapa</a>
    <p class="eyebrow">Fitxa no trobada</p>
    <h1 class="title">Encara no hi ha contingut per a aquest lloc</h1>
  </main>
}
