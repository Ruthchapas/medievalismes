<a appBackButton routerLink="/mapa" class="back" aria-label="Torna al mapa"></a>

<div class="actions">
  <button
    type="button"
    class="action-btn"
    [class.saved]="saved()"
    (click)="toggleSaved()"
    [attr.aria-pressed]="saved()"
    aria-label="Desa aquest lloc"
  >
    <svg viewBox="0 0 24 24"><path d="M6,4 H18 V21 L12,16 L6,21 Z" /></svg>
  </button>
  <button type="button" class="action-btn" aria-label="Comparteix">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12,15 V4 M8,8 L12,4 L16,8" />
      <path d="M5,13 V19 H19 V13" />
    </svg>
  </button>
</div>

<div class="photo" [style]="photoStyle()" [class.has-photo]="place().photoUrl">
  @if (place().routeTag) {
    <span class="route-tag">{{ place().routeTag }}</span>
  }
  <svg class="ornament" [attr.viewBox]="'0 0 ' + ribbonWidth + ' 70'" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <filter [attr.id]="filterId" x="-5%" y="-20%" width="110%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5" />
        <feGaussianBlur stdDeviation="1.4" />
      </filter>
    </defs>
    <g [attr.filter]="'url(#' + filterId + ')'" opacity="0.9">
      <path d="M0,60 Q200,40 400,55 T800,48 T1200,56 T1600,46 V70 H0 Z" fill="var(--color-oliva)" opacity="0.55" />
      @for (leaf of leaves; track leaf.x) {
        <ellipse
          [attr.cx]="leaf.x"
          [attr.cy]="leaf.y"
          rx="11"
          ry="5"
          fill="var(--color-oliva)"
          opacity="0.6"
          [attr.transform]="'rotate(' + leaf.rotate + ' ' + leaf.x + ' ' + leaf.y + ')'"
        />
      }
      @for (x of olives; track x) {
        <ellipse [attr.cx]="x" cy="58" rx="20" ry="9" fill="var(--color-terracota)" opacity="0.55" />
      }
    </g>
  </svg>
  <h1 class="name">{{ place().name }}</h1>
</div>

<p class="meta">
  {{ place().name | uppercase }} · {{ place().comarca | uppercase }} · {{ place().altitud }}M ·
  {{ place().habitants }} HAB.
</p>
