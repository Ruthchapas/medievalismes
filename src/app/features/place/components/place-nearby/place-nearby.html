@if (nearby().length) {
  <h2 class="h2">A prop teu</h2>

  <svg class="mini-map" viewBox="0 0 300 150" preserveAspectRatio="none">
    <path d="M40,120 Q120,90 160,80 T260,50" fill="none" stroke="var(--color-terracota)" stroke-width="1.5" stroke-dasharray="1 6" />
    <circle cx="160" cy="80" r="5" fill="var(--color-terracota)" stroke="var(--color-ink)" stroke-width="1" />
    <circle cx="40" cy="120" r="3.5" fill="var(--color-blau)" stroke="var(--color-ink)" stroke-width="1" />
    <circle cx="260" cy="50" r="3.5" fill="var(--color-oliva)" stroke="var(--color-ink)" stroke-width="1" />
  </svg>

  <div class="row">
    @for (item of nearby(); track item.slug) {
      <a class="card" [routerLink]="['/lloc', item.slug]">
        <div class="thumb" [style.background]="item.photoUrl ? 'url(' + item.photoUrl + ')' : 'linear-gradient(155deg, #cbd3ae, #8b9970)'"></div>
        <p class="name">{{ item.name }}</p>
        <p class="dist">{{ item.distanceKm }} km</p>
      </a>
    }
  </div>
}
