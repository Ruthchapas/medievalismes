<h2 class="h2">A prop teu</h2>

<a
  class="mini-map"
  routerLink="/mapa"
  [queryParams]="{ lloc: place().slug }"
  [attr.aria-label]="'Obre el mapa centrat a ' + place().name"
  (click)="openMap()"
>
  <div class="mini-map__canvas" #miniMap></div>
  <span class="mini-map__hint">Veure al mapa ›</span>
</a>

@if (nearby().length) {
  <div class="row">
    @for (item of nearby(); track item.place.slug) {
      <a class="card" [routerLink]="['/lloc', item.place.slug]">
        <div
          class="thumb"
          [style.background]="item.place.photoUrl ? 'url(' + item.place.photoUrl + ')' : 'linear-gradient(155deg, #cbd3ae, #8b9970)'"
        ></div>
        <p class="name">{{ item.place.name }}</p>
        <p class="dist">{{ item.distance }} km</p>
      </a>
    }
  </div>
}
